# /etc/fail2ban/jail.d/tpl-navette.conf
#
# ATTENZIONE: il blocco agisce sulle porte 80 e 443 dell'INTERA macchina, che
# ospita anche app-tpl.comune.imperia.it. Un indirizzo bandito perde l'accesso
# a entrambi i siti. E' accettabile - chi insiste sulle credenziali altrui non
# ha ragione di consultare nemmeno l'altro - ma va saputo.
#
# I limiti applicativi restano la prima difesa: fail2ban interviene su chi
# continua a provare nonostante li abbia gia' superati.

[tpl-navette]
enabled  = true
filter   = tpl-navette
logpath  = /var/log/tpl-navette/access.log
port     = http,https
banaction = iptables-multiport

# 10 tentativi respinti in 10 minuti -> un'ora di blocco
maxretry = 10
findtime = 600
bantime  = 3600

# chi ricade viene bandito piu' a lungo
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 86400

# indirizzi da non bandire mai: la rete di chi amministra il sistema
ignoreip = 127.0.0.1/8 ::1 198.51.100.0/24 203.0.113.10
