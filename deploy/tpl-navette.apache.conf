# Reverse proxy per l'applicazione TPL navette.
# a2enmod proxy proxy_http headers ssl
# Il certificato si ottiene con: certbot --apache -d tpl.comune.imperia.it

<VirtualHost *:80>
    ServerName tpl.comune.imperia.it
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName tpl.comune.imperia.it

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/tpl.comune.imperia.it/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/tpl.comune.imperia.it/privkey.pem

    # gli archivi giornalieri pesano 70-90 MB
    LimitRequestBody 536870912

    ProxyPreserveHost On
    ProxyTimeout 900
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    # cartella dedicata: in /var/log/apache2 il glob di sistema li ruoterebbe
    # a 14 giorni, qui valgono i 180 di /etc/logrotate.d/tpl-navette
    ErrorLog  /var/log/tpl-navette/error.log
    CustomLog /var/log/tpl-navette/access.log combined
</VirtualHost>
