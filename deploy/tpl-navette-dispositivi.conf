# Estensione dell'unita' dell'applicazione, da installare in
# /etc/systemd/system/tpl-navette.service.d/dispositivi.conf
#
# L'applicazione gira con ProtectSystem=strict: senza dichiarare questi
# percorsi vedrebbe la cartella condivisa in sola lettura e la pagina
# "Dispositivi" direbbe che la funzione non e' disponibile.
#
# Non si tocca NoNewPrivileges: l'applicazione continua a non poter elevare i
# privilegi, e le operazioni le esegue il servizio di supporto.

[Service]
ReadWritePaths=/var/lib/tpl-dispositivi/richieste
ReadWritePaths=/var/lib/tpl-dispositivi/risposte
