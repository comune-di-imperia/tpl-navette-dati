# /etc/fail2ban/filter.d/tpl-navette.conf
#
# Legge il log del vhost, non quello di gunicorn: dietro il proxy gunicorn
# vede sempre 127.0.0.1, mentre Apache e' l'ultimo salto e registra
# l'indirizzo reale del client.
#
# Si contano solo i tentativi RESPINTI dall'applicazione:
#   401  credenziali non valide
#   429  gia' oltre il limite applicativo (20 accessi/ora, 5 recuperi/ora)
# Le richieste riuscite e la semplice navigazione non contano.

[Definition]
failregex = ^<HOST> .* "POST /accesso[^"]*" (401|429)
            ^<HOST> .* "POST /password/richiedi[^"]*" 429
            ^<HOST> .* "(GET|POST) /[^"]*" 403

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
