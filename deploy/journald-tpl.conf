# /etc/systemd/journald.conf.d/tpl-navette.conf
#
# ATTENZIONE: journald e' di TUTTA la macchina, non di questo servizio: il
# VPS ospita anche app-tpl.comune.imperia.it. Qui si mette solo un tetto, per
# evitare che il journal cresca fino al 10% del disco senza che nessuno se ne
# accorga; la ritenzione a un anno e' abbondante e oggi non cancella nulla,
# visto che la macchina e' in servizio da agosto 2026.

[Journal]
Storage=persistent
SystemMaxUse=500M
MaxRetentionSec=1year
