{% extends "base.html" %}
{% block titolo %}Cambio password{% endblock %}
{% block contenuto %}
<div class="accesso">
  <h1>Cambio password</h1>
  {% if errore %}<div class="avviso errore">{{ errore }}</div>{% endif %}
  <p class="minuto">
    Al salvataggio tutte le sessioni aperte vengono chiuse, compresa questa:
    dovrai accedere di nuovo con la password nuova.
  </p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ gettone() }}">
    <label>Password attuale
      <input type="password" name="attuale" autocomplete="current-password" required>
    </label>
    <label>Nuova password
      <input type="password" name="password" autocomplete="new-password"
             minlength="12" required>
    </label>
    <button type="submit">Salva</button>
  </form>
</div>
{% endblock %}
