{% extends "base.html" %}
{% block titolo %}Accesso{% endblock %}
{% block contenuto %}
<div class="accesso">
  <h1>Accesso</h1>
  {% if errore %}<div class="avviso errore">{{ errore }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ gettone() }}">
    <label>Utente
      <input type="text" name="utente" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Entra</button>
  </form>
  <p class="minuto">
    <a href="{{ url_for('richiedi_password') }}">Password dimenticata?</a>
  </p>
</div>
{% endblock %}
